name: Android Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Appium
        run: npm install -g appium@3

      - name: Install UiAutomator2 driver
        run: appium driver install uiautomator2

      - name: Download test APK
        run: |
          curl -L \
            -o Android-MyDemoAppRN.apk \
            https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_UDID: emulator-5554
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            echo "Connected Android devices:"
            adb devices

            adb install -r Android-MyDemoAppRN.apk

            appium \
              --address 127.0.0.1 \
              --port 4723 \
              --log appium.log &

            for i in {1..60}; do
              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium is ready"
                break
              fi

              echo "Waiting for Appium..."
              sleep 2
            done

            echo "Starting mobile test suite..."
            npm run test:android

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-failure-artifacts
          path: |
            artifacts/screenshots/
            artifacts/page-source/
            appium.log
          if-no-files-found: ignore
